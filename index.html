<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BISCCO | beauty salon - hair make & フェイシャルエステ（南さつま市加世田）</title>
    <!-- フォントの読み込み -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&family=Montserrat:wght@400;500&family=Noto+Serif+JP:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            /* お店の外観に合わせたカラーパレット */
            --frame-greige: #b5ada3;   /* 塗り壁のグレージュ（フレーム） */
            --bg-offwhite: #faf8f5;    /* 白い外壁・メニュー表のオフホワイト */
            --bg-sand: #ede8e1;        /* 柔らかいサンドベージュ */
            --bg-wood: #9c8879;        /* 入り口の木目調・温かみのあるブラウン */
            --accent-gold: #b89f78;    /* メニュー表のゴールドベージュ */
            --text-dark: #3e3a37;      /* チャコールブラウン */
            --text-light: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Noto Serif JP', serif;
            color: var(--text-dark);
            background-color: var(--bg-offwhite);
            line-height: 1.9;
            padding-left: 36px; /* 左側のグレージュフレーム分 */
            padding-top: 64px;  /* 上部のヘッダー分 */
        }

        /* 左端の固定グレージュフレーム（whyte風） */
        .left-frame {
            position: fixed;
            top: 0;
            left: 0;
            width: 36px;
            height: 100vh;
            background-color: var(--frame-greige);
            z-index: 90;
        }

        /* 上部の固定ヘッダー */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 64px;
            background-color: var(--frame-greige);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 100;
        }

        /* BISCCO ロゴ（看板のマークを再現） */
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-light);
            font-family: 'Montserrat', sans-serif;
            font-size: 20px;
            letter-spacing: 4px;
            font-weight: 500;
        }

        .logo-svg {
            width: 28px;
            height: 24px;
            fill: var(--text-light);
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.1));
        }

        /* ヘッダー右側のアクションエリア（予約ボタン＋インスタ＋メニュー） */
        .header-actions {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        /* ヘッダーの予約・電話ボタン */
        .btn-reserve {
            color: var(--text-light);
            border: 1px solid var(--text-light);
            padding: 6px 14px;
            font-family: 'Cormorant Garamond', serif;
            font-size: 13px;
            letter-spacing: 1.5px;
            text-decoration: none;
            transition: 0.3s;
        }

        .btn-reserve:hover {
            background-color: var(--text-light);
            color: var(--frame-greige);
        }

        /* ① ヘッダーのInstagramアイコンボタン */
        .header-insta {
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-light);
            text-decoration: none;
            transition: 0.3s;
        }

        .header-insta svg {
            width: 21px;
            height: 21px;
            stroke: var(--text-light);
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .header-insta:hover {
            opacity: 0.75;
        }

        /* ハンバーガーメニューボタン */
        .menu-toggle {
            width: 28px;
            height: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            background: none;
            border: none;
        }

        .menu-toggle span {
            display: block;
            width: 100%;
            height: 1.5px;
            background-color: var(--text-light);
        }

        /* ナビゲーションドロワー */
        .nav-drawer {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            max-width: 340px;
            height: 100vh;
            background-color: var(--frame-greige);
            z-index: 200;
            padding: 80px 40px;
            transition: 0.4s ease;
            box-shadow: -5px 0 20px rgba(0,0,0,0.1);
        }

        .nav-drawer.active {
            right: 0;
        }

        .nav-close {
            position: absolute;
            top: 18px;
            right: 25px;
            font-size: 32px;
            color: var(--text-light);
            background: none;
            border: none;
            cursor: pointer;
        }

        .nav-drawer ul {
            list-style: none;
        }

        .nav-drawer li {
            margin-bottom: 20px;
        }

        .nav-drawer a {
            color: var(--text-light);
            text-decoration: none;
            font-family: 'Cormorant Garamond', serif;
            font-size: 26px;
            letter-spacing: 2px;
        }

        /* セクション共通設定 */
        section {
            position: relative;
            padding: 80px 25px 80px 45px;
            max-width: 860px;
            margin: 0 auto;
        }

        .section-wrapper {
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        /* 左端フレーム境界の縦向きタイトル（whyte風） */
        .side-title {
            position: absolute;
            top: 65px;
            left: -16px;
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            font-family: 'Cormorant Garamond', serif;
            font-size: 54px;
            font-weight: 600;
            color: var(--text-light);
            letter-spacing: 3px;
            line-height: 1;
            user-select: none;
            z-index: 95;
            text-shadow: 0 2px 8px rgba(0,0,0,0.12);
        }

        .side-title.dark-text {
            color: var(--frame-greige);
            text-shadow: none;
        }

        /* 1. ヒーロー＆オープン告知・コンセプト */
        .hero-concept {
            background: linear-gradient(160deg, #cbc4bc 0%, #9e958b 50%, #877d73 100%);
            color: var(--text-light);
            min-height: 88vh;
            display: flex;
            align-items: center;
        }

        .open-badge {
            display: inline-block;
            border: 1px solid rgba(255,255,255,0.7);
            padding: 8px 22px;
            margin-bottom: 25px;
            font-family: 'Cormorant Garamond', serif;
            letter-spacing: 2px;
            font-size: 16px;
            background: rgba(255,255,255,0.1);
        }

        .hero-catch {
            font-family: 'Cormorant Garamond', serif;
            font-size: 56px;
            line-height: 1.1;
            margin-bottom: 20px;
            font-weight: 400;
            letter-spacing: 2px;
        }

        .service-tags {
            font-size: 15px;
            letter-spacing: 3px;
            margin-bottom: 35px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.4);
            display: inline-block;
        }

        .concept-sub {
            font-size: 20px;
            margin-bottom: 25px;
            letter-spacing: 2px;
            font-weight: 400;
        }

        .concept-text {
            font-size: 14px;
            line-height: 2.3;
            max-width: 540px;
            letter-spacing: 0.08em;
            opacity: 0.95;
        }

        /* 2. Menu（メニュー表のエレガントなデザインを再現） */
        .menu-wrap {
            background-color: var(--bg-offwhite);
        }

        .menu-script-header {
            font-family: 'Great Vibes', cursive;
            font-size: 64px;
            color: var(--accent-gold);
            text-align: center;
            font-weight: normal;
            margin-bottom: 40px;
            line-height: 1;
        }

        .menu-grid {
            max-width: 580px;
            margin: 0 auto;
        }

        .menu-category {
            margin-bottom: 40px;
        }

        .menu-category h3 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 26px;
            color: var(--accent-gold);
            letter-spacing: 1.5px;
            margin-bottom: 16px;
            font-weight: 400;
            border-bottom: 1px solid #e5dfd5;
            padding-bottom: 6px;
        }

        .menu-list {
            list-style: none;
        }

        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 12px;
            font-size: 14px;
            letter-spacing: 0.06em;
        }

        .menu-price {
            font-family: 'Cormorant Garamond', serif;
            font-size: 18px;
            letter-spacing: 1px;
            font-variant-numeric: lining-nums;
            display: inline-flex;
            align-items: center;
        }

        /* 「〜」の位置を数字の真横にピタッと
