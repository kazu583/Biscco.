<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BISCCO | beauty salon - hair make & フェイシャルエステ（南さつま市加世田）</title>
    <!-- フォントの読み込み（1つ前のbiscco.htmlと完全同一） -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Great+Vibes&family=Montserrat:wght@400;500&family=Noto+Serif+JP:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --frame-greige: #b5ada3;   /* 塗り壁のグレージュ（フレーム） */
            --bg-offwhite: #faf8f5;    /* メニュー表のオフホワイト */
            --bg-sand: #ede8e1;        /* 柔らかいサンドベージュ */
            --bg-wood: #9c8879;        /* サロン紹介のウォームブラウン */
            --accent-gold: #b89f78;    /* メニュー表のゴールドベージュ */
            --text-dark: #3e3a37;      /* チャコールブラウン */
            --text-light: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Noto Serif JP', serif;
            color: var(--text-dark);
            background-color: var(--bg-offwhite);
            line-height: 1.9;
            padding-left: 36px;
            padding-top: 64px;
        }

        /* 左端の固定グレージュフレーム */
        .left-frame {
            position: fixed;
            top: 0;
            left: 0;
            width: 36px;
            height: 100vh;
            background-color: var(--frame-greige);
            z-index: 90;
        }

        /* 上部の固定ヘッダー */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 64px;
            background-color: var(--frame-greige);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 100;
            border-bottom: 1px solid rgba(255,255,255,0.18);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-light);
            font-family: 'Montserrat', sans-serif;
            font-size: 19px;
            letter-spacing: 4px;
            font-weight: 500;
        }

        .logo-svg {
            width: 26px;
            height: 22px;
            fill: var(--text-light);
        }

        .btn-reserve {
            color: var(--text-light);
            border: 1px solid rgba(255,255,255,0.8);
            padding: 7px 18px;
            font-family: 'Cormorant Garamond', serif;
            font-size: 13px;
            letter-spacing: 2px;
            text-decoration: none;
            transition: 0.3s;
        }

        .btn-reserve:hover {
            background-color: var(--text-light);
            color: var(--frame-greige);
        }

        .menu-toggle {
            width: 26px;
            height: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            background: none;
            border: none;
        }

        .menu-toggle span {
            display: block;
            width: 100%;
            height: 1.5px;
            background-color: var(--text-light);
        }

        /* ナビゲーションドロワー */
        .nav-drawer {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            max-width: 340px;
            height: 100vh;
            background-color: var(--frame-greige);
            z-index: 200;
            padding: 80px 40px;
            transition: 0.4s ease;
            box-shadow: -5px 0 20px rgba(0,0,0,0.1);
        }

        .nav-drawer.active {
            right: 0;
        }

        .nav-close {
            position: absolute;
            top: 18px;
            right: 25px;
            font-size: 32px;
            color: var(--text-light);
            background: none;
            border: none;
            cursor: pointer;
        }

        .nav-drawer ul {
            list-style: none;
        }

        .nav-drawer li {
            margin-bottom: 20px;
        }

        .nav-drawer a {
            color: var(--text-light);
            text-decoration: none;
            font-family: 'Cormorant Garamond', serif;
            font-size: 26px;
            letter-spacing: 2px;
        }

        /* セクション共通設定 */
        section {
            position: relative;
            padding: 80px 25px 80px 50px;
            max-width: 960px;
            margin: 0 auto;
        }

        .section-wrapper {
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        /* 左端フレーム境界の縦向きタイトル */
        .side-title {
            position: absolute;
            top: 75px;
            left: -14px;
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            font-family: 'Cormorant Garamond', serif;
            font-size: 52px;
            font-weight: 500;
            color: var(--text-light);
            letter-spacing: 4px;
            line-height: 1;
            user-select: none;
            z-index: 95;
        }

        .side-title.dark-text {
            color: var(--frame-greige);
        }

        /* 1. ヒーロー＆コンセプト（biscco.htmlのトーン・フォントを完全再現） */
        .hero-concept {
            background: linear-gradient(135deg, #c2bab0 0%, #a99f94 55%, #94897e 100%);
            color: var(--text-light);
            min-height: calc(100vh - 64px);
            display: flex;
            align-items: center;
        }

        .hero-inner {
            display: grid;
            grid-template-columns: 1fr;
            gap: 45px;
            align-items: center;
            width: 100%;
        }

        .open-badge {
            display: inline-block;
            border: 1px solid rgba(255,255,255,0.65);
            padding: 7px 20px;
            margin-bottom: 26px;
            font-family: 'Cormorant Garamond', serif;
            letter-spacing: 2.5px;
            font-size: 15px;
            background: rgba(255,255,255,0.08);
        }

        .hero-sub-en {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 25px;
            letter-spacing: 2.5px;
            opacity: 0.92;
            margin-bottom: 6px;
        }

        .hero-catch {
            font-family: 'Montserrat', sans-serif;
            font-size: 54px;
            line-height: 1.05;
            margin-bottom: 20px;
            font-weight: 500;
            letter-spacing: 8px;
        }

        .service-tags {
            font-size: 14px;
            letter-spacing: 3px;
            margin-bottom: 34px;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(255,255,255,0.35);
            display: inline-block;
        }

        .concept-sub {
            font-size: 19px;
            line-height: 1.7;
            margin-bottom: 22px;
            letter-spacing: 2px;
            font-weight: 400;
        }

        .concept-text {
            font-size: 13px;
            line-height: 2.25;
            max-width: 480px;
            letter-spacing: 0.06em;
            opacity: 0.92;
        }

        /* 右側の情報カード（ロゴ部分のみ修正） */
        .hero-card {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.28);
            border-radius: 6px;
            padding: 40px 28px;
            text-align: center;
            max-width: 320px;
            margin: 0 auto;
            width: 100%;
        }

        /* 丸いロゴ枠：logo.jpgの四隅の白フチが見えないよう拡大してトリミング */
        .hero-logo-circle {
            width: 120px;
            height: 120px;
            margin: 0 auto 24px auto;
            border-radius: 50%;
            overflow: hidden;
            border: 1.5px solid rgba(255, 255, 255, 0.55);
            background-color: #9c9690;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .hero-logo-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scale(1.18); /* 白い外周を隠して丸いモルタル面だけを表示 */
        }

        .hero-card-date {
            font-family: 'Cormorant Garamond', serif;
            font-size: 24px;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .hero-card-hours {
            font-size: 11.5px;
            line-height: 1.9;
            opacity: 0.88;
            padding-bottom: 20px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.22);
        }

        .hero-card-services {
            font-family: 'Cormorant Garamond', serif;
            font-size: 14.5px;
            letter-spacing: 1.5px;
            line-height: 1.75;
            opacity: 0.92;
        }

        /* 2. Menu */
        .menu-wrap {
            background-color: var(--bg-offwhite);
        }

        .menu-script-header {
            font-family: 'Great Vibes', cursive;
            font-size: 64px;
            color: var(--accent-gold);
            text-align: center;
            font-weight: normal;
            margin-bottom: 40px;
            line-height: 1;
        }

        .menu-grid {
            max-width: 580px;
            margin: 0 auto;
        }

        .menu-category {
            margin-bottom: 40px;
        }

        .menu-category h3 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 26px;
            color: var(--accent-gold);
            letter-spacing: 1.5px;
            margin-bottom: 16px;
            font-weight: 400;
            border-bottom: 1px solid #e5dfd5;
            padding-bottom: 6px;
        }

        .menu-list {
            list-style: none;
        }

        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
